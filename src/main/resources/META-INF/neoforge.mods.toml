# 1.21.1（NeoForge 21.1.x）必须显式声明 modLoader / loaderVersion；license 必填。
# 花括号占位符由 build.gradle 的 processResources 在构建时展开（值来自 gradle.properties）。
# 注意：不要在本文件里写“美元号+花括号”形式的示例文字，它会被 Groovy 模板当表达式求值导致构建失败。
modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"

[[mixins]]
config="ae2split.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
versionRange="${neo_version_range}"
type="required"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
versionRange="${minecraft_version_range}"
type="required"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
versionRange="${ae2_version_range}"
type="required"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
versionRange="[0,)"
type="optional"
ordering="NONE"
side="BOTH"
