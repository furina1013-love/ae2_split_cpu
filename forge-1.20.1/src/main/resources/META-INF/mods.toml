[[mods]]
modId="ae2-split-cpu"
version="1.1.0"
displayName="AE2 Split CPU"
authors="furina1013"
description='''
Splits an AE2 crafting CPU into virtual sub-CPUs on job submission: each job runs on its own
sub-CPU sized to that job, with bytes and co-processor threads temporarily reserved from the
master CPU and restored when the job finishes. Add the Split Component block to a CPU multiblock
to allow it to split.
'''

