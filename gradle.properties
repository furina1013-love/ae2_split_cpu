org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.249

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1.150,)
ae2_version_range=[19.0.0,)

# Mod metadata（mod_id 与 @Mod 注解必须一致）
mod_id=ae2_split_cpu
mod_name=AE2 Split CPU
mod_version=1.2.3
mod_group_id=cn.furina.ae2split
mod_authors=Furina
mod_license=MIT
mod_description=Splits an AE2 crafting CPU into working sub-CPUs at job submission time.

# 编译基准的 AE2 版本（仅编译期；运行时由服务端提供）
ae2_version=19.2.19
