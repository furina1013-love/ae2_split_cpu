name: build-and-release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: neoforge-1.21.1
            dir: .
            java: '21'
            loader: neoforge-1.21.1
            ae2_path: libs/appliedenergistics2-19.2.19.jar
            ae2_url: https://mediafilez.forgecdn.net/files/9519/988/appliedenergistics2-19.2.19.jar
          - name: forge-1.20.1
            dir: forge-1.20.1
            java: '17'
            loader: forge-1.20.1
            ae2_path: forge-1.20.1/libs/appliedenergistics2-forge-15.4.12.jar
            ae2_url: https://mediafilez.forgecdn.net/files/9357/405/appliedenergistics2-forge-15.4.12.jar
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.loader }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-${{ matrix.loader }}-

      - name: Fetch AE2 (compile-time only)
        run: |
          mkdir -p "$(dirname "${{ matrix.ae2_path }}")"
          curl -fsSL -o "${{ matrix.ae2_path }}" "${{ matrix.ae2_url }}"

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Stage jar
        id: stage
        run: |
          VERSION=$(grep -m1 '^mod_version=' "${{ matrix.dir }}/gradle.properties" | cut -d= -f2 | tr -d '\r')
          if [ -z "$VERSION" ]; then VERSION=dev; fi
          # 只使用本次构建的产物目录，避免把仓库里遗留的旧 dist/*.jar 一起打进去。
          rm -rf ci-dist
          mkdir -p ci-dist
          JAR=$(ls "${{ matrix.dir }}/build/libs/"*-$VERSION.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::No jar matching version $VERSION; build/libs contains:"
            ls -la "${{ matrix.dir }}/build/libs/" || true
            exit 1
          fi
          OUT="ci-dist/ae2-split-cpu-$VERSION-${{ matrix.loader }}.jar"
          cp "$JAR" "$OUT"
          echo "jar=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la ci-dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.loader }}
          path: ci-dist/*.jar

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List jars
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          name: AE2 Split CPU ${{ github.ref_name }}
          draft: false
          prerelease: false

